# Builds the two downloadable apps the landing page links to:
#   Tiro-Windows-x64.zip — self-contained single EXE (WebView2 shell + web core)
#   Tiro-macOS.zip       — upstream's Swift menu-bar app, ad-hoc signed
#
# Every push builds both and uploads them as workflow artifacts.
#
# A release is published three ways, all producing the same thing:
#   - push a tag like v1.0.0
#   - push a branch named release/v1.0.0
#   - run this workflow manually and give it a version
#
# The last two create the tag from the run. They exist because pushing a tag
# needs credentials that some environments do not have, and without them a
# release cannot be cut from those environments at all.
#
# Publishing happens in one job that waits for both builds, so a release always
# carries both assets. Attaching from each build job separately would race, with
# two jobs trying to create the same release at once.
#
# Release builds of the Windows EXE are Authenticode-signed by SignPath Foundation
# when the repository carries the settings docs/SIGNING.md describes; without them
# the same ZIP is produced unsigned.

name: build

on:
  push:
    branches: ["main", "claude/**", "release/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0. Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write # create the tag, the release, and upload assets

jobs:
  # The web core is the product on the phone and the whole UI inside the Windows
  # app, so it gets a real browser rather than a linter. Fast, and it gates
  # nothing: a red smoke test should not stop you shipping the Mac build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Check the generated files match their source
        # tokens.css/tokens.js and the icons are generated from
        # shared/design-tokens.json. If a commit edits one by hand they drift,
        # and the drift only shows up as a wrong colour on someone's phone.
        run: |
          node scripts/gen-tokens.mjs
          node scripts/gen-icons.mjs
          git diff --exit-code -- web/ shared/ || {
            echo "::error::Generated files are stale — run gen-tokens.mjs and gen-icons.mjs and commit the result."
            exit 1; }

      - name: Smoke-test the PWA in Chromium
        run: node scripts/smoke-web.mjs

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 covers every Intel/AMD PC, and runs under emulation on ARM.
          - rid: win-x64
            asset: Tiro-Windows-x64
          # Native build for Snapdragon/Surface machines. Emulation works but
          # costs startup time and memory, and Windows has no universal-binary
          # format, so ARM needs its own file.
          - rid: win-arm64
            asset: Tiro-Windows-arm64
    permissions:
      contents: read
      actions: read # SignPath reads back the artifact this job uploads
    env:
      # Signing is opt-in and configured entirely from repository settings, so a fork
      # or a pull request — neither of which can see the secret — still builds a working
      # (unsigned) EXE instead of failing. See docs/SIGNING.md for the setup.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained EXE
        run: >
          dotnet publish windows/Tiro.Windows/Tiro.Windows.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtraction=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      # SignPath Foundation signs releases, not every push: its free tier is for
      # published open-source builds, and each signing request is a human-auditable
      # record rather than something to spend on a branch build.
      - name: Decide whether this build gets signed
        id: signing
        shell: pwsh
        run: |
          $isRelease = '${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') }}' -eq 'true'
          $configured = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and
                        -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)
          # Only x64 is signed. SignPath Foundation's free tier is metered in
          # human-approved signing requests, and x64 is what almost everyone
          # downloads; spending a second request per release on ARM is not worth it.
          $isPrimary = '${{ matrix.rid }}' -eq 'win-x64'
          $sign = $isRelease -and $configured -and $isPrimary
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($sign) { "Signing this build with SignPath." }
          elseif ($isRelease -and -not $isPrimary) { "${{ matrix.rid }} ships unsigned by design; see docs/SIGNING.md." }
          elseif ($isRelease) { "::warning::Releasing an unsigned Windows build — SignPath is not configured (docs/SIGNING.md)." }
          else { "Not a release build; skipping signing." }

      - name: Upload the unsigned build for SignPath
        id: unsigned
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-unsigned
          path: publish/
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.signing.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tiro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-zip' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify the signature
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/Tiro.exe
          if ($sig.Status -ne 'Valid') { throw "Tiro.exe came back $($sig.Status), not Valid." }
          "Signed by $($sig.SignerCertificate.Subject)"

      - name: Zip
        shell: pwsh
        # `signed` exists only when the steps above ran, so an unsigned build still ships.
        # SignPath returns the artifact's own layout, but a nested folder would quietly
        # produce a ZIP nobody can run, so check before packing rather than after.
        run: |
          $source = if (Test-Path signed) { 'signed' } else { 'publish' }
          if (-not (Test-Path (Join-Path $source 'Tiro.exe'))) {
            throw "$source/Tiro.exe is missing — the ZIP layout would be wrong."
          }
          Compress-Archive -Path "$source/*" -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Tiro.app
        run: ./make-app.sh

      # make-app.sh already refuses a single-architecture build, but the runner is
      # Apple Silicon and an Intel-less binary is invisible here — it fails only on
      # a user's Intel Mac. Assert it again on the artifact that actually ships.
      - name: Check the binary is universal
        run: |
          archs=$(lipo -archs Tiro.app/Contents/MacOS/Tiro)
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || {
            echo "::error::Tiro-macOS.zip would not run on Intel Macs (got: $archs)"; exit 1; }

      - name: Zip (ditto preserves the bundle)
        run: ditto -c -k --keepParent Tiro.app Tiro-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tiro-macOS
          path: Tiro-macOS.zip

  release:
    needs: [windows, macos]
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${REF#refs/heads/release/}" != "${REF}" ]; then
            version="${REF_NAME#release/}"   # release/v1.0.0 -> v1.0.0
          else
            version="${REF_NAME}"            # tag push
          fi
          case "$version" in
            v*) ;;
            *) echo "version '$version' must start with v" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: Tiro ${{ steps.v.outputs.version }}
          files: dist/*.zip
          make_latest: true
          body: |
            Hold a key, speak, and punctuated text lands where your cursor is.
            Bring your own Deepgram API key — about half a cent per minute, no subscription.

            Not sure which one? The [download page](https://github.com/Gabriel-Dalton/tiro#getting-the-apps)
            picks it for you.

            | Download | For |
            |---|---|
            | `Tiro-Windows-x64.zip` | Windows 10 and 11 on any Intel or AMD PC. Unzip and run `Tiro.exe`. It lives in the tray; hold **Right Alt** in any app to dictate. |
            | `Tiro-Windows-arm64.zip` | Windows 11 on ARM — Snapdragon and Surface. The x64 build also runs there under emulation; this one is native. |
            | `Tiro-macOS.zip` | macOS 13+, **universal** — the same file runs on Apple Silicon and Intel. Move `Tiro.app` to Applications and hold **Fn**. |

            Linux, ChromeOS, Android and anything older: open `/app/` on the site. The web app
            needs no download and installs to a home screen.

            **Windows 10** also needs Microsoft's free
            [WebView2 runtime](https://developer.microsoft.com/microsoft-edge/webview2/), which
            Windows 11 already includes. Tiro checks on first run and offers it if it is missing.

            If Windows SmartScreen stops the app, unblock the ZIP **before** extracting it —
            right-click it → Properties → tick **Unblock** → OK — or, from the dialog itself,
            choose **More info → Run anyway**. On macOS the first launch needs
            System Settings → Privacy & Security → **Open Anyway**; on macOS 14 and earlier,
            right-click the app and choose **Open**.

            First run asks for a Deepgram API key, free at
            [console.deepgram.com](https://console.deepgram.com). It is stored on your device
            and sent only to Deepgram — there is no server in between.
