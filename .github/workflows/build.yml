# Builds the two downloadable apps the landing page links to:
#   Tiro-Windows-x64.zip — self-contained single EXE (WebView2 shell + web core)
#   Tiro-macOS.zip       — upstream's Swift menu-bar app, ad-hoc signed
#
# Every push builds both and uploads them as workflow artifacts.
#
# A release is published two ways:
#   - push a tag like v1.0.0, or
#   - run this workflow manually and give it a version, which creates the tag
#     and the release from the run. This exists because some environments can
#     push branches but not tags.
#
# Publishing happens in one job that waits for both builds, so a release always
# carries both assets. Attaching from each build job separately would race, with
# two jobs trying to create the same release at once.

name: build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0. Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write # create the tag, the release, and upload assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained EXE
        run: >
          dotnet publish windows/Tiro.Windows/Tiro.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtraction=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Tiro-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tiro-Windows-x64
          path: Tiro-Windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Tiro.app
        run: ./make-app.sh

      - name: Zip (ditto preserves the bundle)
        run: ditto -c -k --keepParent Tiro.app Tiro-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tiro-macOS
          path: Tiro-macOS.zip

  release:
    needs: [windows, macos]
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Tiro ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*.zip
          make_latest: true
          body: |
            Hold a key, speak, and punctuated text lands where your cursor is.
            Bring your own Deepgram API key — about half a cent per minute, no subscription.

            | Download | For |
            |---|---|
            | `Tiro-Windows-x64.zip` | Windows 11. Unzip and run `Tiro.exe`. It lives in the tray; hold **Right Alt** in any app to dictate. |
            | `Tiro-macOS.zip` | macOS 13+. Unzip and move `Tiro.app` to Applications. Hold **Fn** to dictate. |

            The web app needs no download — open `/app/` on the site and Add to Home Screen.

            Both builds are unsigned. Windows SmartScreen asks once: **More info → Run anyway**.
            On macOS, right-click the app and choose **Open** the first time.

            First run asks for a Deepgram API key, free at
            [console.deepgram.com](https://console.deepgram.com). It is stored on your device
            and sent only to Deepgram — there is no server in between.
