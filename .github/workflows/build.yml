# Builds the two downloadable apps the landing page links to:
#   Tiro-Windows-x64.exe   self-contained single EXE (WebView2 shell + web core)
#   Tiro-macOS.zip         upstream's Swift menu-bar app, ad-hoc signed
#
# Every push builds both and uploads them as workflow artifacts.
#
# A release is published three ways, all producing the same thing:
#   - push a tag like v1.0.0
#   - push a branch named release/v1.0.0
#   - run this workflow manually and give it a version
#
# The last two create the tag from the run. They exist because pushing a tag
# needs credentials that some environments do not have, and without them a
# release cannot be cut from those environments at all.
#
# Whichever route is taken, the version has to match the VERSION file, which is
# what the apps themselves report. The `version` job below enforces that, so a
# release can never ship apps that name a different version than the tag.
#
# Publishing happens in one job that waits for both builds, so a release always
# carries both assets. Attaching from each build job separately would race, with
# two jobs trying to create the same release at once.
#
# Release builds of the Windows EXE are Authenticode-signed by SignPath Foundation
# when the repository carries the settings docs/SIGNING.md describes; without them
# the same EXE is produced unsigned.

name: build

on:
  push:
    branches: ["main", "claude/**", "release/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0. Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write # create the tag, the release, and upload assets

jobs:
  # Everything in the repository that a script writes: the version stamps, the design
  # tokens, and the icon set. Cheap, and it runs on every push, so a stale one is caught
  # long before anyone tries to cut a release with it.
  #
  # The committed output is what ships, which is the part that is easy to miss.
  # Tiro.Windows.csproj copies web/ verbatim into the EXE, and Vercel regenerates on
  # deploy while Windows does not, so a forgotten regenerate would put the site and the
  # desktop app on different palettes with nothing to notice it.
  generated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history, because check-attribution.mjs works on the commits being
      # proposed — `git merge-base origin/main HEAD` has nothing to say in the
      # single-commit clone checkout gives you by default, and the check would
      # quietly degrade to scanning files only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to the patch, not just the major. gen-icons.mjs encodes its PNGs with
      # node:zlib at level 9, so the committed bytes depend on the zlib that Node
      # bundles, and a Node bump can move them with the artwork itself identical. An
      # exact pin turns that from a mystery red build into a deliberate one: bump this
      # line, regenerate, commit the new bytes.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Regenerate everything a script writes
        run: |
          set -euo pipefail
          node scripts/gen-version.mjs
          node scripts/gen-tokens.mjs
          node scripts/gen-icons.mjs

      # --porcelain rather than `git diff --exit-code`, so a newly generated file that
      # was never committed counts as drift too instead of passing as untracked.
      - name: Fail if the committed output drifted from its source
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            git diff -- . ':!*.png' ':!*.ico'
            echo "::error::Generated files are stale. Run: node scripts/gen-version.mjs && node scripts/gen-tokens.mjs && node scripts/gen-icons.mjs. If only the images moved and this job's Node pin just changed, that is the compression, not the artwork."
            exit 1
          fi
          echo "Generated files match VERSION and shared/design-tokens.json."

      # The release job already refuses to publish a tag that disagrees with VERSION,
      # but that only fires while a release is being cut. It cannot catch VERSION
      # sitting behind a release that already shipped, which is exactly what happened
      # when the file was introduced: v1.0.1 was live, and VERSION was seeded 1.0.0, so
      # the download page advertised a version one patch behind itself and nothing
      # complained. This closes that side: VERSION may equal the latest release, or run
      # ahead of it while the next one is being prepared, but it may never trail it.
      - name: Fail if VERSION is behind the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A fork, or a repository with no releases yet, has nothing to compare against.
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "No published release to compare against; nothing to check."
            exit 0
          fi
          current=$(tr -d '[:space:]' < VERSION)
          released="${latest#v}"
          if [ "$current" = "$released" ]; then
            echo "VERSION ($current) matches the latest release ($latest)."
            exit 0
          fi
          # sort -V puts the lower version first, so if VERSION sorts first it trails.
          if [ "$(printf '%s\n%s\n' "$released" "$current" | sort -V | head -1)" = "$current" ]; then
            echo "::error::VERSION is $current but $latest is already published. Bump VERSION to at least $released and run: node scripts/gen-version.mjs"
            exit 1
          fi
          echo "VERSION ($current) is ahead of the latest release ($latest), which is the normal pre-release state."

      # The release job would catch this too, but only at the moment someone is
      # cutting a release, which is the worst time to discover that the version
      # you are shipping has nothing written about it. Failing here means the
      # notes are written by whoever bumped VERSION, while they still remember
      # what changed.
      - name: Fail if the CHANGELOG does not describe VERSION
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --tag "v$(tr -d '[:space:]' < VERSION)" > /dev/null
          echo "CHANGELOG.md describes VERSION."

      # Nothing in this repository says it was written by an AI (CLAUDE.md). A
      # rule that lives only in a document is one every fresh session gets to
      # rediscover after it has already published a footer, and a commit trailer
      # cannot be taken back after a merge without rewriting published history.
      # So it fails here, on the commits being proposed, while they can still be
      # amended.
      - name: Fail on AI attribution in commits or files
        run: node scripts/check-attribution.mjs

      # Releases are cut from the notes in .changes/ with no human checkpoint, so a
      # change that arrives without one would ship to everybody having never been
      # classified by anyone. This is the only place that is caught.
      - name: Fail when a change says nothing about what a user would notice
        run: node scripts/check-changes.mjs

      # The arithmetic the release rests on, asserted on its own: the bump that wins
      # when notes disagree, and the version that comes next. 1.9.0 -> 1.10.0 is the
      # case worth a test, because getting it wrong is silent — versions keep being
      # cut, and nobody is ever told about an update again.
      - name: Test the release logic
        run: node scripts/test-changes.mjs

  # Turns the pending impact notes into a release, on main, in this run.
  #
  # It has to happen here rather than in a workflow of its own, because a push made
  # with GITHUB_TOKEN does not trigger another workflow run. A job that pushed a tag
  # and trusted the `on: push: tags` trigger above to build it would cut versions that
  # never published anything, and would look like it was working: the tag appears, the
  # commit lands, and only the release is missing. So the tag is created here and the
  # jobs below build the commit it points at, all in one run.
  #
  # No `if:` on the job, deliberately. A skipped job skips everything that needs it, so
  # gating here would mean no branch ever built Windows or macOS again. It runs
  # everywhere and returns immediately when there is nothing to do.
  cut:
    needs: [generated]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
      sha: ${{ steps.cut.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Cut a release if any notes are pending
        id: cut
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Not main, so nothing is cut here. Pending notes:"
            node scripts/check-changes.mjs
            exit 0
          fi
          # next-version.mjs exits 1 when the notes add up to no release, which is the
          # ordinary case for most merges — a docs change, a test, a refactor.
          if ! next=$(node scripts/next-version.mjs); then
            echo "No impact notes pending, so this merge releases nothing."
            exit 0
          fi
          node scripts/cut-release.mjs

          # The bot is the honest author: nobody wrote this commit, a script assembled
          # it from notes people wrote in their own pull requests.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Separate -m flags rather than one string with newlines in it: a YAML block
          # scalar would carry this file's indentation into the commit body.
          git commit \
            -m "Release ${next}" \
            -m "Assembled by scripts/cut-release.mjs from the impact notes merged since the last release. Each note is in the commit that added it, with the reasoning for its bump."
          git tag "v${next}"
          git push origin HEAD:main
          git push origin "v${next}"

          echo "version=v${next}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Cut v${next}"

  # The web core is the product on the phone and the whole UI inside the Windows
  # app, so it gets a real browser rather than a linter. Fast, and it gates
  # nothing: a red smoke test should not stop you shipping the Mac build.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Drive the browser the runner already has, rather than downloading one.
      # cdn.playwright.dev began answering 403 "this service is not available in
      # your location" for these runners on 2026-08-17, which is not something a
      # build of this repository can fix or usefully wait out: it turned every
      # push red at the Install step, before a line of the suite had run.
      #
      # smoke-web.mjs already takes TIRO_CHROMIUM for exactly this. It was added
      # to point a local run at a system Chromium, and CI uses the same door.
      # The download is still the fallback, so a runner image that drops Chrome
      # goes back to the old behaviour rather than failing.
      - name: Install Playwright, and find a browser for it to drive
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright@1
          for candidate in "${CHROME_PATH:-}" /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              echo "Driving $candidate ($("$candidate" --version))"
              echo "TIRO_CHROMIUM=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::No preinstalled browser found, downloading one."
          npx playwright install --with-deps chromium

      - name: Check the generated tokens and icons match their source
        # The palette, the behavioural constants and the icon set all come out of
        # shared/design-tokens.json. Hand-edit one of the generated files and the
        # drift shows up as a wrong colour on someone's phone, nowhere else.
        # (The version stamps have their own job above.)
        run: |
          set -euo pipefail
          node scripts/gen-tokens.mjs
          node scripts/gen-icons.mjs
          git diff --exit-code -- web/ shared/ windows/ || {
            echo "::error::Generated files are stale. Run gen-tokens.mjs and gen-icons.mjs, then commit the result."
            exit 1
          }

      - name: Smoke-test the PWA in Chromium
        run: node scripts/smoke-web.mjs

  # `needs: cut` so that when a release is cut in this run, the apps are built from the
  # commit that carries the new version rather than from the one that was pushed. Without
  # it the ZIPs would report the previous version while the tag claimed the new one.
  windows:
    needs: [cut]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 covers every Intel/AMD PC, and runs under emulation on ARM.
          - rid: win-x64
            asset: Tiro-Windows-x64
          # Native build for Snapdragon/Surface machines. Emulation works but
          # costs startup time and memory, and Windows has no universal-binary
          # format, so ARM needs its own file.
          - rid: win-arm64
            asset: Tiro-Windows-arm64
    permissions:
      contents: read
      actions: read # SignPath reads back the artifact this job uploads
    env:
      # Signing is opt-in and configured entirely from repository settings, so a fork
      # or a pull request, neither of which can see the secret, still builds a working
      # (unsigned) EXE instead of failing. See docs/SIGNING.md for the setup.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # empty on every build that is not cutting a release, which checks out the ref
          # that was pushed, exactly as before
          ref: ${{ needs.cut.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained EXE
        run: >
          dotnet publish windows/Tiro.Windows/Tiro.Windows.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtraction=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      # SignPath Foundation signs releases, not every push: its free tier is for
      # published open-source builds, and each signing request is a human-auditable
      # record rather than something to spend on a branch build.
      - name: Decide whether this build gets signed
        id: signing
        shell: pwsh
        run: |
          $isRelease = '${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') }}' -eq 'true'
          $configured = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and
                        -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)
          # Only x64 is signed. SignPath Foundation's free tier is metered in
          # human-approved signing requests, and x64 is what almost everyone
          # downloads; spending a second request per release on ARM is not worth it.
          $isPrimary = '${{ matrix.rid }}' -eq 'win-x64'
          $sign = $isRelease -and $configured -and $isPrimary
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($sign) { "Signing this build with SignPath." }
          elseif ($isRelease -and -not $isPrimary) { "${{ matrix.rid }} ships unsigned by design; see docs/SIGNING.md." }
          elseif ($isRelease) { "::warning::Releasing an unsigned Windows build. SignPath is not configured (docs/SIGNING.md)." }
          else { "Not a release build; skipping signing." }

      - name: Upload the unsigned build for SignPath
        id: unsigned
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-unsigned
          path: publish/
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.signing.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tiro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-zip' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify the signature
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/Tiro.exe
          if ($sig.Status -ne 'Valid') { throw "Tiro.exe came back $($sig.Status), not Valid." }
          "Signed by $($sig.SignerCertificate.Subject)"

      # The download is one EXE, not an archive. It used to be a ZIP because
      # PublishSingleFile does not bundle Content files, so the "single file"
      # publish was really the EXE plus Assets/ plus the whole web core, and
      # twenty-seven loose files have to be held together by something.
      #
      # That ZIP was the worst part of using Tiro on Windows. Explorer runs an EXE
      # from inside one by extracting it to %TEMP%, so the app people thought they
      # had installed lived somewhere Windows deletes: it could not be pinned to
      # the taskbar in any way that survived a reboot, and every launch meant
      # finding the ZIP again. web/ and Assets/ are embedded resources now
      # (windows/Tiro.Windows/Resources.cs), so there is one file to ship.
      #
      # `dotnet publish` still leaves files beside the EXE that nobody now
      # receives: XML doc comments for IntelliSense, and WebView2's native loader,
      # which the package copies to the output as a convenience for
      # framework-dependent apps even though IncludeNativeLibrariesForSelfExtraction
      # has already put a copy inside the bundle. Listing them is worth it, but a
      # list cannot tell you which ones matter, and the first attempt at this step
      # guessed: it failed the build on any stray at all, which is both too strict
      # (a doc file is not a dependency) and too weak (it can only see what the
      # build produced, never whether the EXE actually works without it).
      #
      # So the EXE is copied somewhere empty and made to prove it, below.
      - name: Take the EXE on its own
        shell: pwsh
        # `signed` exists only when the steps above ran, so an unsigned build still ships.
        run: |
          $source = if (Test-Path signed) { 'signed' } else { 'publish' }
          $exe = Join-Path $source 'Tiro.exe'
          if (-not (Test-Path $exe)) { throw "$source/Tiro.exe is missing." }

          $root = (Resolve-Path $source).Path
          Get-ChildItem $source -Recurse -File |
            Where-Object { $_.Name -ne 'Tiro.exe' } |
            ForEach-Object { Write-Host "  left behind: $($_.FullName.Substring($root.Length + 1))" }

          # Nothing else goes in here. That is the entire point of the folder.
          New-Item -ItemType Directory -Force -Path standalone | Out-Null
          Copy-Item $exe standalone/Tiro.exe
          Copy-Item $exe "${{ matrix.asset }}.exe"
          "{0}: {1:N1} MB" -f "${{ matrix.asset }}.exe", ((Get-Item "${{ matrix.asset }}.exe").Length / 1MB)

      # Run from a folder holding nothing but Tiro.exe, which is what the user
      # downloads. That turns "is the single file self-sufficient" from something
      # argued about in a comment into something the build answers: the self-test
      # loads the embedded web core, extracts it, and asks WebView2 for its
      # version, which is a P/Invoke into the native loader and so fails here
      # rather than on somebody's PC if that loader did not make it into the
      # bundle. It also still covers version comparison, where a string compare
      # says 1.9.0 beats 1.10.0 and every user silently stops hearing about
      # updates.
      #
      # x64 only — the arm64 build is the same IL and this runner cannot execute it.
      - name: Prove the single EXE works with nothing beside it
        if: matrix.rid == 'win-x64'
        shell: pwsh
        # Start-Process -Wait, not `&`. Tiro.exe is a GUI-subsystem binary — it
        # has to be, or every launch would flash a console window — and the shell
        # does not wait on those: `&` returns immediately, leaves $LASTEXITCODE
        # untouched, and the next line reads a log the app has not written yet.
        run: |
          $exe = (Resolve-Path standalone/Tiro.exe).Path   # Start-Process resolves against the
          # process CWD, which PowerShell does not keep in step with Set-Location
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test' `
                               -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          $log = Join-Path $env:APPDATA 'Tiro/tiro.log'
          if (Test-Path $log) { Get-Content $log -Tail 60 } else { "No log at $log" }
          if ($run.ExitCode -ne 0) { throw "Tiro.exe --self-test exited $($run.ExitCode); see the log above." }
          "Self-test passed against the EXE that ships, alone in its own folder."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.exe

  macos:
    needs: [cut]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.sha }}

      - name: Build Tiro.app
        run: ./make-app.sh

      # make-app.sh already refuses a single-architecture build, but the runner is
      # Apple Silicon and an Intel-less binary is invisible here. It fails only on
      # a user's Intel Mac. Assert it again on the artifact that actually ships.
      - name: Check the binary is universal
        run: |
          archs=$(lipo -archs Tiro.app/Contents/MacOS/Tiro)
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || {
            echo "::error::Tiro-macOS.zip would not run on Intel Macs (got: $archs)"; exit 1; }

      - name: Zip (ditto preserves the bundle)
        run: ditto -c -k --keepParent Tiro.app Tiro-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tiro-macOS
          path: Tiro-macOS.zip

  release:
    # `generated` gates the release rather than the builds: a stale stamp or palette
    # should stop a release going out, but not a branch build being tested.
    needs: [generated, cut, windows, macos]
    if: >
      needs.cut.outputs.version != '' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      # checkout first: it cleans the workspace, which would take the artifacts with it
      - uses: actions/checkout@v4
        with:
          # the release commit when this run cut one, so VERSION and CHANGELOG.md are the
          # ones being published rather than the ones that were pushed
          ref: ${{ needs.cut.outputs.sha }}

      # for scripts/gen-winget.mjs below
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - name: Resolve version
        id: v
        env:
          CUT_VERSION: ${{ needs.cut.outputs.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${CUT_VERSION}" ]; then
            version="${CUT_VERSION}"        # cut from impact notes earlier in this run
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${REF#refs/heads/release/}" != "${REF}" ]; then
            version="${REF_NAME#release/}"   # release/v1.0.0 -> v1.0.0
          else
            version="${REF_NAME}"            # tag push
          fi
          case "$version" in
            v*) ;;
            *) echo "version '$version' must start with v" >&2; exit 1 ;;
          esac
          # The apps report VERSION, so a tag that disagrees with it would
          # publish downloads that name a version nobody can look up.
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$expected" ]; then
            echo "::error::releasing $version, but VERSION says $expected" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      # The manifests point at release URLs that do not exist yet, and carry the
      # SHA256 of the ZIPs about to be attached. Both are deterministic, so they
      # can be built here and shipped in the same release they describe.
      #
      # continue-on-error because the manifests are downstream of the release, not
      # part of it: if this step ever breaks, the three apps should still ship and
      # the submission can be regenerated by hand from docs/PACKAGING.md. The step
      # still goes red in the run, so a break is visible rather than silent.
      - name: Build the winget manifests
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/gen-winget.mjs \
            --tag "${{ steps.v.outputs.version }}" \
            --x64 dist/Tiro-Windows-x64.exe \
            --arm64 dist/Tiro-Windows-arm64.exe \
            --out winget-out
          # Zipped so the manifests/g/GabrielDalton/Tiro/<version>/ path survives:
          # that path is the package identity as far as winget-pkgs is concerned,
          # and three loose YAML files lose it.
          (cd winget-out && zip -r ../dist/Tiro-winget-manifests.zip manifests)

      # The notes are the CHANGELOG section for this version plus the evergreen
      # download and first-run half. Running it here rather than pasting a body
      # into this file means the notes on the release page and the notes in the
      # repository cannot drift, and a version the CHANGELOG does not describe
      # fails the release rather than shipping without notes.
      - name: Build the release notes
        run: node scripts/release-notes.mjs --tag "${{ steps.v.outputs.version }}" --releasing --out notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: Tiro ${{ steps.v.outputs.version }}
          # The Windows builds are bare EXEs now; the Mac app and the winget
          # manifests are still archives, so both patterns have to be listed.
          files: |
            dist/*.exe
            dist/*.zip
