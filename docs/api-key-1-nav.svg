<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 452" width="260" height="452" role="img"
     aria-label="The Deepgram console sidebar. Under a Manage heading, the items are Dashboard, API Keys (highlighted), Usage, Project and Team, and Billing.">
  <title>Deepgram console sidebar, with API Keys under Manage</title>
  <rect width="260" height="452" fill="#111214"/>

  <!-- wordmark -->
  <g transform="translate(20 24)">
    <path d="M2 2 L11 2 A7 7 0 0 1 11 16 L2 16 Z M2 9 L7 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="16px" font-weight="700" fill="#ffffff" letter-spacing="-.01em" x="20" y="14">Deepgram</text>
    <rect x="212" y="3" width="13" height="12" rx="2" fill="none" stroke="#8b9097" stroke-width="1.3"/>
    <path d="M218.5 4 V14" stroke="#8b9097" stroke-width="1.3"/>
  </g>

  <!-- Explore -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="12px" fill="#8b9097" letter-spacing=".02em" x="20" y="76">Explore</text>

  <g transform="translate(20 92)">
