  <!-- API Keys: the highlighted row -->
  <rect x="0" y="298" width="260" height="34" fill="#26262b"/>
  <rect x="0" y="298" width="3" height="34" fill="#13ef93"/>
  <g transform="translate(20 306)">
    <circle fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" cx="4.4" cy="9" r="3.2"/><path fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M7.2 7.4 L13 2.2 M10.6 3.4 l1.6 1.6"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#ffffff" x="24" y="11">API Keys</text>
  </g>

  <g transform="translate(20 344)">
    <path fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M1.6 12.4 h11 M3 9.6 L6 5.8 l2.8 2.4 L12.4 3"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Usage</text>
    <path fill="none" stroke="#8b9097" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M78 5 L82 9 L86 5"/>
  </g>
  <g transform="translate(20 380)">
    <circle fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" cx="5" cy="5" r="2.4"/><path fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M1.2 12.4 a3.9 3.9 0 0 1 7.6 0 M10 3.2 a2.2 2.2 0 0 1 0 4 M11.2 12.4 a3.4 3.4 0 0 0 -1.6 -2.8"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Project &amp; Team</text>
  </g>
  <g transform="translate(20 416)">
    <circle fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" cx="7" cy="7" r="6.2"/><path fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M7 3.6 v6.8 M5.2 5.4 h3 a1.6 1.6 0 0 1 0 3.2 h-2 a1.6 1.6 0 0 0 0 3.2 h3"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Billing</text>
    <path fill="none" stroke="#8b9097" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M78 5 L82 9 L86 5"/>
  </g>
