    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Speech to Text</text>
    <path fill="none" stroke="#8b9097" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M134 5 L138 9 L142 5"/>
  </g>
  <g transform="translate(20 128)">
    <path fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M7 1.6 a2.6 2.6 0 0 1 2.6 2.6 v3.2 a2.6 2.6 0 0 1 -5.2 0 V4.2 A2.6 2.6 0 0 1 7 1.6 Z M2.6 7.6 a4.4 4.4 0 0 0 8.8 0 M7 12 v1.6"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Text to Speech</text>
  </g>
  <g transform="translate(20 164)">
    <path fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M1.6 8.6 V7 a5.4 5.4 0 0 1 10.8 0 v1.6 M1.6 7.6 h2.2 v4.4 H1.6 Z M10.2 7.6 h2.2 v4.4 h-2.2 Z"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Voice Agent</text>
  </g>
  <g transform="translate(20 200)">
    <path fill="none" stroke="#c9ccd1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M5.4 2 a2.6 2.6 0 0 0 0 10 M8.6 2 a2.6 2.6 0 0 1 0 10 M7 2.4 v9.4"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="24" y="11">Text Intelligence</text>
  </g>

  <!-- Manage -->
