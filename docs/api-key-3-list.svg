<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="The API Keys page. It warns that secrets are not recoverable, offers a Create a New API Key button, and lists two keys: a new one named Tiro that never expires, and an auto-generated Playground key expiring in 7 hours.">
  <title>Deepgram's API Keys page, listing a new key</title>
  <rect width="900" height="470" fill="#0d0d0f"/>

  <!-- page heading -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="30px" font-weight="600" fill="#ffffff" x="32" y="46">API Keys</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" fill="#8b9097" x="32" y="70">Project ID: ••••••••-••••-••••-••••-••••••••••••</text>

  <!-- left: create -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="18px" font-weight="600" fill="#ffffff" x="32" y="116">Create and manage API Keys</text>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13px" fill="#b4b8bd" x="32" y="144">
    <tspan x="32" dy="0">Remember to save your API Keys in a safe spot.</tspan>
    <tspan x="32" dy="19">For security purposes, secrets are not recoverable.</tspan>
  </text>
  <rect x="32" y="182" width="212" height="46" rx="4" fill="#13ef93"/>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" font-weight="600" fill="#08130d" x="138" y="211" text-anchor="middle">Create a New API Key</text>

  <!-- right: using your key -->
  <rect x="596" y="96" width="272" height="132" rx="4" fill="#17181b" stroke="#2c2f34" stroke-width="1"/>
  <rect x="596" y="96" width="272" height="34" fill="#1f2125"/>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" font-weight="600" fill="#ffffff" x="612" y="118">Using your API Key</text>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13px" fill="#b4b8bd" x="612" y="152">
    <tspan x="612" dy="0">API Keys act like a password for API</tspan>
    <tspan x="612" dy="17">Authentication. Your secret should look</tspan>
    <tspan x="612" dy="17">like a 40 character alphanumeric.</tspan>
  </text>
  <rect x="612" y="192" width="240" height="22" rx="3" fill="#0d0d0f"/>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5px" fill="#8b9097" x="620" y="207">Authorization: Token &lt;your_secret&gt;</text>

  <!-- table -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="18px" font-weight="600" fill="#ffffff" x="32" y="286">API Keys</text>

  <line x1="32" y1="316" x2="868" y2="316" stroke="#2c2f34" stroke-width="1"/>
  <g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="12.5px" font-weight="600" fill="#e6e8ea">
    <text x="40" y="338">Comment</text>
    <text x="330" y="338">Secret</text>
    <text x="470" y="338">Role</text>
    <text x="562" y="338">Created</text>
    <text x="690" y="338">Expires</text>
  </g>
  <line x1="32" y1="352" x2="868" y2="352" stroke="#2c2f34" stroke-width="1"/>

  <!-- row 1: the key you just made -->
  <g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="12.5px" fill="#c9ccd1">
    <path d="M44 378 l5 5 l5 -5" fill="none" stroke="#8b9097" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="384" fill="#ffffff">Tiro</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13px" fill="#8b9097" letter-spacing="1px" x="330" y="384">•••••••••••••••</text>
    <text x="470" y="384">Owner</text>
    <text x="562" y="384">Just now</text>
    <text x="690" y="384">–</text>
  </g>
  <g stroke="#8b9097" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M832 373 h14 M836 373 v-3 h6 v3 M834 373 v13 h10 v-13"/>
  </g>
  <line x1="32" y1="404" x2="868" y2="404" stroke="#212429" stroke-width="1"/>

  <!-- row 2: the trap -->
  <g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="12.5px" fill="#c9ccd1">
    <path d="M44 430 l5 5 l5 -5" fill="none" stroke="#8b9097" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="436">Auto-generated Playground API key</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13px" fill="#8b9097" letter-spacing="1px" x="330" y="436">•••••••••••••••</text>
    <text x="470" y="436">Default</text>
    <text x="562" y="436">12 minutes ago</text>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="12.5px" fill="#e0a54a" x="690" y="436">7 hours</text>
  </g>
  <g stroke="#8b9097" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M832 425 h14 M836 425 v-3 h6 v3 M834 425 v13 h10 v-13"/>
  </g>
</svg>
