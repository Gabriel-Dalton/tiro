<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 604" width="576" height="604" role="img"
     aria-label="The Create an API Key dialog. Step one names the key, step two sets expiration with Never selected, an Advanced section stays collapsed, and a Create Key button sits at the bottom.">
  <title>Deepgram's “Create an API Key” dialog</title>
  <rect width="576" height="604" fill="#141417"/>

  <!-- title bar -->
  <rect x="0" y="0" width="576" height="52" fill="#1b1b1f"/>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="17px" font-weight="600" fill="#ffffff" x="288" y="32" text-anchor="middle">Create an API Key</text>
  <path d="M540 20 L554 34 M554 20 L540 34" stroke="#c9ccd1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- explanatory copy -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13px" fill="#b4b8bd" x="36" y="88">
    <tspan x="36" dy="0">All API keys created here can use Deepgram’s voice AI for our speech-to-</tspan>
    <tspan x="36" dy="19">text, text-to-speech, and voice agent APIs. By default, API keys can’t read or</tspan>
    <tspan x="36" dy="19">modify the project they’re in, or create further API keys.</tspan>
  </text>

  <!-- 1. name -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14.5px" font-weight="600" fill="#ffffff" x="36" y="168">1. Name your key:</text>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="13.5px" fill="#c9ccd1" x="52" y="200">Friendly name (Comment)</text>
  <rect x="52" y="214" width="488" height="42" rx="4" fill="#111214" stroke="#5b6068" stroke-width="1.4"/>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" fill="#6f747b" x="70" y="240">My first useful key</text>

  <line x1="36" y1="292" x2="540" y2="292" stroke="#2c2f34" stroke-width="1"/>

  <!-- 2. expiration -->
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14.5px" font-weight="600" fill="#ffffff" x="36" y="326">2. Set expiration:</text>

  <g transform="translate(52 350)">
    <circle cx="9" cy="9" r="8.4" fill="none" stroke="#13ef93" stroke-width="1.6"/>
    <circle cx="9" cy="9" r="4.4" fill="#13ef93"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" fill="#d7dade" x="32" y="14">Never</text>
  </g>
  <g transform="translate(52 394)">
    <circle cx="9" cy="9" r="8.4" fill="none" stroke="#6f747b" stroke-width="1.6"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" fill="#d7dade" x="32" y="14">Duration</text>
  </g>
  <g transform="translate(52 438)">
    <circle cx="9" cy="9" r="8.4" fill="none" stroke="#6f747b" stroke-width="1.6"/>
    <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" fill="#d7dade" x="32" y="14">Date</text>
  </g>

  <line x1="36" y1="490" x2="540" y2="490" stroke="#2c2f34" stroke-width="1"/>

  <!-- advanced, collapsed -->
  <path d="M40 512 L46 518 L40 524" fill="none" stroke="#c9ccd1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" fill="#d7dade" x="58" y="523">Advanced</text>

  <!-- create -->
  <rect x="404" y="552" width="136" height="40" rx="4" fill="#2a2d31"/>
  <text font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14px" font-weight="600" fill="#9aa0a7" x="472" y="577" text-anchor="middle">Create Key</text>
</svg>
