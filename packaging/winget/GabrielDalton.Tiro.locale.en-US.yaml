ShortDescription: Hold a key, speak, and punctuated text lands where your cursor is.
Description: |-
  Tiro is hold-to-talk dictation for Windows. Hold Right Alt in any app, speak, and the
  transcript is typed into whatever text box has focus. Tap instead of holding to go
  hands-free until you tap again.

  It sits in the tray and uses Deepgram for speech recognition, with your own API key
  stored encrypted on the machine via DPAPI. There is no account, no telemetry, and no
  server in between: audio goes to Deepgram while you are dictating and nowhere else.
  That works out at roughly half a cent per minute instead of a monthly subscription.

  Transcripts are kept locally in a searchable history you can export as JSONL. This is
  a fork of the macOS app by Toby Stapleton, extended to Windows and the web around a
  shared core.
